[package]
name = "armorchat-openmls"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
license = "Apache-2.0"
publish = false

[lib]
name = "armorchat_openmls"
crate-type = ["cdylib", "rlib"]

[dependencies]
openmls = { version = "=0.9.0", default-features = false, features = ["openmls_rust_crypto"] }
openmls_rust_crypto = "=0.6.0"
openmls_basic_credential = { version = "=0.6.0", features = ["clonable"] }
openmls_traits = "=0.6.0"
tls_codec = { version = "=0.5.0", features = ["derive"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
serde_json_canonicalizer = "=0.3.2"
base64 = "=0.22.1"
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["std", "rand_core"] }
rand_core = { version = "=0.6.4", default-features = false, features = ["getrandom"] }
zeroize = "=1.9.0"
aes-gcm = "=0.10.3"
jni = { version = "=0.21.1", default-features = false }

[profile.release]
panic = "unwind"
lto = "thin"
codegen-units = 1
strip = "debuginfo"
