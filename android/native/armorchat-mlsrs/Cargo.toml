[package]
name = "armorchat-mlsrs"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "Apache-2.0"
publish = false

[lib]
name = "armorchat_mlsrs"
crate-type = ["cdylib", "rlib"]

[dependencies]
mls-rs = { version = "=0.56.0", default-features = false, features = ["std", "private_message", "out_of_order", "fast_serialize", "tree_index"] }
mls-rs-crypto-rustcrypto = { version = "=0.22.1", default-features = false, features = ["std"] }
mls-rs-core = { version = "=0.27.0", default-features = false, features = ["std"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
serde_json_canonicalizer = "=0.3.2"
base64 = "=0.22.1"
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["std", "rand_core"] }
rand_core = { version = "=0.6.4", default-features = false, features = ["getrandom"] }
zeroize = "=1.8.1"
aes-gcm = "=0.10.3"
jni = { version = "=0.21.1", default-features = false }

[profile.release]
panic = "unwind"
lto = "thin"
codegen-units = 1
strip = "debuginfo"
