[package]
name = "armorchat-vodozemac"
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
license = "Apache-2.0"
publish = false

[lib]
name = "armorchat_vodozemac"
crate-type = ["cdylib", "rlib"]

[dependencies]
vodozemac = { version = "=0.10.0", default-features = false }
jni = { version = "=0.21.1", default-features = false }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
serde_json_canonicalizer = "=0.3.2"
base64 = "=0.22.1"

[profile.release]
panic = "unwind"
lto = "thin"
codegen-units = 1
strip = "debuginfo"
